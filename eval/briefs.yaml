# Eval brief library — 15 Dutch-context test briefs across 6 categories.
#
# Each entry feeds two systems for comparison:
#   1. The agency pipeline (Researcher -> Copywriter -> Critic loop)
#   2. The baseline (solo Gemini 2.5 Pro, one-shot)
#
# Both outputs are then scored by an independent Grader (separate Pro instance,
# same six-point rubric the Critic uses).
#
# Briefs deliberately concentrated on Tilburg / Brabant / Netherlands context
# so domain familiarity matches the portfolio's target audience.

briefs:
  # ---- PRICING (3) ----
  - id: pricing-fintech-brabant-manufacturing
    category: pricing
    difficulty: medium
    brief: "Pricing strategy for a Dutch B2B fintech entering Brabant manufacturing"

  - id: pricing-saas-tech-smb
