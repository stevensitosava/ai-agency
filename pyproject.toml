[project]
name = "ai-agency"
version = "0.1.0"
description = "Multi-agent virtual consulting agency — portfolio project"
authors = [{ name = "Steven Sawarin" }]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "tavily-python>=0.5.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Week 2+
db = [
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
]
# Week 3+ — LangGraph refactor
graph = [
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
]
# Week 4+ — deliverables
docs = [
    "weasyprint>=63.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
]
# Dev tools
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
